name: Compilar APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generar proyecto Android
        run: flutter create . --platforms=android --project-name app_reproductor --org com.haltonjuan
      - name: Instalar dependencias
        run: flutter pub get
      - name: Parchear namespace faltante en plugins viejos
        run: |
          cat >> android/build.gradle << 'PATCH'

          subprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin('com.android.library')) {
                      def android = project.extensions.findByName('android')
                      if (android != null && android.namespace == null) {
                          android.namespace = project.group
                      }
                  }
              }
          }
          PATCH
      - name: Compilar APK
        run: flutter build apk --release
      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
